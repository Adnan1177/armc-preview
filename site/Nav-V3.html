<style>
body{margin:0;background:#F7F2EB}
a{color:#2B4944}a:hover{color:#D96C00}
@keyframes up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes marquee{to{transform:translateX(-50%)}}
@keyframes draw{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,200,0,.55)}100%{box-shadow:0 0 0 18px rgba(255,200,0,0)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(37,165,95,.5)}100%{box-shadow:0 0 0 20px rgba(37,165,95,0)}}
@keyframes shine{from{transform:translateX(120%) skewX(-20deg)}to{transform:translateX(-220%) skewX(-20deg)}}
.up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.4s}.d4{animation-delay:.55s}
.spin{animation:spin 90s linear infinite}.spin-r{animation:spin 120s linear infinite reverse}
.floaty{animation:floaty 6s ease-in-out infinite}.floaty2{animation:floaty 7s ease-in-out -2s infinite}
.marquee{animation:marquee 40s linear infinite}
.draw{stroke-dasharray:600;animation:draw 1.6s .6s cubic-bezier(.6,0,.2,1) both}
.pulse{animation:pulse 2.2s ease-out infinite}
.wa{animation:ring 2.4s ease-out infinite}
.btn{transition:transform .25s ease,box-shadow .25s ease;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px -10px rgba(0,0,0,.35)}
.btn-y::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 3.5s ease-in-out infinite}
.navl{position:relative;transition:color .2s}
.navl::after{content:"";position:absolute;right:0;bottom:-6px;height:2px;width:0;background:#FFC800;transition:width .3s}
.navl:hover{color:#FFC800 !important}.navl:hover::after{width:100%}
.card{transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s}
.card:hover{transform:translateY(-10px);box-shadow:0 30px 60px -22px rgba(43,73,68,.4)}
.card .ic{transition:transform .5s cubic-bezier(.2,.7,.2,1)}.card:hover .ic{transform:rotate(-12deg) scale(1.08)}
.card .bar{transform:scaleX(0);transform-origin:right;transition:transform .5s cubic-bezier(.2,.7,.2,1)}.card:hover .bar{transform:scaleX(1)}
.tile{transition:background .35s,transform .35s}.tile:hover{transform:translateY(-4px)}
.stage{transition:background .3s,color .3s,transform .3s,box-shadow .3s}
@supports (animation-timeline: view()){.rv{animation:up linear both;animation-timeline:view();animation-range:entry 0% entry 45%}}
@media (max-width: 640px){h1{font-size:44px !important}h2{font-size:30px !important}section{padding-left:16px !important;padding-right:16px !important}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

.sbtn{font-family:inherit;display:flex;align-items:center;gap:12px;width:100%;max-width:440px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:999px;color:#D3E0DC;font-size:15px;padding:12px 18px;cursor:pointer;transition:background .25s,border-color .25s}
.sbtn:hover{background:rgba(255,255,255,.13);border-color:rgba(255,200,0,.5)}
.kbd{font-family:'IBM Plex Sans',sans-serif;font-size:12px;border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:1px 7px;margin-inline-start:auto}
.mbtn{font-family:inherit;display:inline-flex;align-items:center;gap:10px;background:#FFFFFF;color:#2B4944;border:0;border-radius:999px;font-size:15px;font-weight:700;padding:6px 18px 6px 6px;padding-inline-start:18px;cursor:pointer;transition:transform .25s}
.mbtn:hover{transform:translateY(-2px)}
.mbtn span.c{width:38px;height:38px;border-radius:50%;background:#2B4944;color:#FFC800;display:inline-flex;align-items:center;justify-content:center}
.big{display:flex;align-items:center;gap:22px;text-decoration:none;color:#FFFFFF;font-size:58px;font-weight:700;line-height:1.25;padding:10px 0;transition:color .25s}
.big b{font-family:'IBM Plex Sans',sans-serif;font-size:16px;font-weight:500;color:#B9CCC7;width:34px}
.big .ar{opacity:0;transform:translateX(16px);transition:opacity .3s,transform .3s;color:#FFC800}
.big:hover{color:#FFC800}.big:hover .ar{opacity:1;transform:none}
.rs{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;color:#1F2D2A;padding:12px 14px;border-radius:14px;font-size:15px;transition:background .2s}

.tg{font-size:12px;font-weight:600;color:#2B4944;background:#E9E2D6;border-radius:999px;padding:3px 10px;white-space:nowrap}
.qp{font-family:inherit;font-size:14px;border:1px solid #D9D2C6;background:#FFFFFF;color:#2B4944;border-radius:999px;padding:7px 14px;cursor:pointer}
.qp:hover{border-color:#2B4944}
@keyframes ov{from{opacity:0;clip-path:circle(0% at 8% 6%)}to{opacity:1;clip-path:circle(150% at 8% 6%)}}
.ov{animation:ov .7s cubic-bezier(.6,0,.2,1) both}

.icb{width:44px;height:44px;border-radius:14px;background:#2B4944;display:inline-flex;align-items:center;justify-content:center;flex:none;transition:transform .4s cubic-bezier(.2,.7,.2,1)}

.phone{width:360px;height:740px;flex:none;border-radius:48px;border:10px solid #1A2B28;background:#2B4944;overflow:hidden;position:relative;box-shadow:0 40px 80px -30px rgba(26,43,40,.55)}

.sub:hover{color:#A84F00;transform:translateX(-4px)}
.sub i{width:6px;height:6px;border-radius:50%;background:#D96C00;flex:none;display:inline-block}
@keyframes drop{from{opacity:0;transform:translateY(-10px) scale(.985)}to{opacity:1;transform:none}}
.drop{animation:drop .35s cubic-bezier(.2,.7,.2,1) both}
@keyframes sheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
</style>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { search: false, menu: false, q: '' }; }
  renderVals() {
    const cat = [["الاستراتيجية وتطوير الأعمال", "إدارية", "Service-Management.dc.html"], ["التأسيس والتنظيم الإداري", "إدارية", "Service-Management.dc.html"], ["الهياكل التنظيمية والسياسات والإجراءات", "إدارية", "Service-Management.dc.html"], ["التشغيل وتحسين العمليات", "إدارية", "Service-Management.dc.html"], ["إدارة المخاطر واستمرارية الأعمال", "إدارية", "Service-Management.dc.html"], ["الأداء ومؤشرات الأداء", "إدارية", "Service-Management.dc.html"], ["الاستشارات القانونية العامة", "قانونية", "Service-Legal.dc.html"], ["مراجعة وصياغة العقود والاتفاقيات", "قانونية", "Service-Legal.dc.html"], ["استشارات النزاعات والمطالبات", "قانونية", "Service-Legal.dc.html"], ["استشارات الأراضي والعقارات", "قانونية", "Service-Legal.dc.html"], ["استشارات التركات والميراث", "قانونية", "Service-Legal.dc.html"], ["استشارات الشركات والأنظمة التجارية", "قانونية", "Service-Legal.dc.html"], ["الاستشارات الضريبية", "محاسبية وضريبية", "Service-Accounting.dc.html"], ["مسك الدفاتر", "محاسبية وضريبية", "Service-Accounting.dc.html"], ["بناء شجرة الحسابات", "محاسبية وضريبية", "Service-Accounting.dc.html"], ["بناء وتطوير النظام المحاسبي", "محاسبية وضريبية", "Service-Accounting.dc.html"], ["الفحص والتدقيق المالي الداخلي", "محاسبية وضريبية", "Service-Accounting.dc.html"]];
    const st = this.state;
    const norm = (s) => s.replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/^ال/, '').trim();
    const q = norm(st.q || '');
    let list = cat;
    if (q) {
      const words = q.split(/\s+/).filter(Boolean).map((w) => { w = w.replace(/^ال/, ''); if (w.length > 3) w = w.replace(/ه$/, ''); if (w.length > 3) w = w.replace(/ي$/, ''); if (w.length > 4) w = w.replace(/ات$/, ''); return w; });
      list = cat.filter((c) => { const t = norm(c[0] + ' ' + c[1]); return words.every((w) => t.includes(w)); });
    } else {
      list = [cat[0], cat[7], cat[12], cat[1]];
    }
    const results = list.slice(0, 6).map((c) => ({ title: c[0], track: c[1], href: c[2] }));
    const n = list.length;
    const countLabel = !q ? 'اقتراحات' : (n === 0 ? 'لا نتائج' : (n === 1 ? 'نتيجة واحدة' : (n === 2 ? 'نتيجتان' : n + ' نتائج')));
    const set = (w) => () => this.setState({ q: w });
    return {
      notice: this.props.notice ?? true,
      search: st.search, menu: st.menu, q: st.q,
      searchExp: st.search ? 'true' : 'false', menuExp: st.menu ? 'true' : 'false',
      results, empty: !!q && n === 0, countLabel,
      setQ: (e) => this.setState({ q: e.target.value }),
      qk0: set('العقود'), qk1: set('الضريبة'), qk2: set('التأسيس'), qk3: set('التركات'),
      openSearch: () => this.setState({ search: !this.state.search, menu: false }),
      closeSearch: () => this.setState({ search: false }),
      openMenu: () => this.setState({ menu: true, search: false }),
      closeMenu: () => this.setState({ menu: false })
    };
  }
}
window.Component = Component;
</script>
