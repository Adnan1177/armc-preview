<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أفكار الريادة — خدماتنا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&amp;family=IBM+Plex+Sans:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F7F2EB}
a{color:#2B4944}a:hover{color:#D96C00}
@keyframes up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(37,165,95,.5)}100%{box-shadow:0 0 0 20px rgba(37,165,95,0)}}
@keyframes shine{from{transform:translateX(120%) skewX(-20deg)}to{transform:translateX(-220%) skewX(-20deg)}}
.up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.4s}
.spin{animation:spin 90s linear infinite}
.wa{animation:ring 2.4s ease-out infinite}
.btn{transition:transform .25s ease,box-shadow .25s ease;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px -10px rgba(0,0,0,.35)}
.btn-y::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 3.5s ease-in-out infinite}
.navl{position:relative;transition:color .2s}
.navl::after{content:"";position:absolute;right:0;bottom:-6px;height:2px;width:0;background:#FFC800;transition:width .3s}
.navl:hover{color:#FFC800 !important}.navl:hover::after{width:100%}
.card{transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s,outline-color .3s}
.card:hover{transform:translateY(-10px);box-shadow:0 30px 60px -22px rgba(43,73,68,.4)}
.chip{transition:background .25s,color .25s,transform .25s}.chip:hover{transform:translateY(-2px)}
@supports (animation-timeline: view()){.rv{animation:up linear both;animation-timeline:view();animation-range:entry 0% entry 45%}}
@media (max-width: 640px){h1{font-size:40px !important}h2{font-size:30px !important}section{padding-left:16px !important;padding-right:16px !important}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { need: null };
  }
  renderVals() {
    const tracksDef = [
      { id: 'mgmt', num: '01', name: 'الاستشارات الإدارية', href: 'Service-Management.dc.html', desc: 'نبني معك أساسًا إداريًا متينًا، من الاستراتيجية حتى قياس الأداء.', icon: 'M3 3h7v7H3zM14 3h7v7h-7zM8.5 14h7v7h-7zM6.5 10v2h11v-2M12 12v2', items: ['الاستراتيجية وتطوير الأعمال', 'التأسيس والتنظيم الإداري', 'الهياكل التنظيمية والسياسات والإجراءات', 'التشغيل وتحسين العمليات', 'إدارة المخاطر واستمرارية الأعمال', 'الأداء ومؤشرات الأداء'] },
      { id: 'legal', num: '02', name: 'الاستشارات القانونية', href: 'Service-Legal.dc.html', desc: 'رأي قانوني واضح يساعدك على اتخاذ القرار — استشارات فقط دون ترافع أو تمثيل.', icon: 'M12 3v18M7 21h10M5 7h14M5 7l-3 6a3 3 0 0 0 6 0zM19 7l-3 6a3 3 0 0 0 6 0z', items: ['الاستشارات القانونية العامة', 'مراجعة وصياغة العقود والاتفاقيات', 'استشارات النزاعات والمطالبات', 'استشارات الأراضي والعقارات', 'استشارات التركات والميراث', 'استشارات الشركات والأنظمة التجارية'] },
      { id: 'acc', num: '03', name: 'الاستشارات المحاسبية والضريبية', href: 'Service-Accounting.dc.html', desc: 'أنظمة محاسبية واضحة وامتثال ضريبي يحمي منشأتك.', icon: 'M4 2.5h16v19H4zM8 7h8M8 11h2M12 11h2M8 15h2M12 15h2M8 18.5h8', items: ['الاستشارات الضريبية', 'مسك الدفاتر', 'بناء شجرة الحسابات', 'بناء وتطوير النظام المحاسبي', 'الفحص والتدقيق المالي الداخلي'] }
    ];
    const needsDef = [
      { id: 'n1', label: 'أبدأ منشأة أو أعيد تنظيمها', track: 'mgmt' },
      { id: 'n2', label: 'عندي عقد أو نزاع أو تركة', track: 'legal' },
      { id: 'n3', label: 'أحتاج ترتيب حساباتي أو الضريبة', track: 'acc' },
      { id: 'n4', label: 'أريد تحسين أداء فريقي', track: 'mgmt' }
    ];
    const need = needsDef.find((n) => n.id === this.state.need);
    const rec = need ? need.track : null;
    const needs = needsDef.map((n) => ({
      label: n.label,
      pressed: this.state.need === n.id ? 'true' : 'false',
      bg: this.state.need === n.id ? '#2B4944' : '#FFFFFF',
      fg: this.state.need === n.id ? '#FFFFFF' : '#2B4944',
      pick: () => this.setState({ need: this.state.need === n.id ? null : n.id })
    }));
    const tracks = tracksDef.map((t, i) => {
      const dark = i === 1;
      return Object.assign({}, t, {
        rec: rec === t.id,
        ring: rec === t.id ? '#FFC800' : 'transparent',
        bg: dark ? '#2B4944' : '#FFFFFF',
        fg: dark ? '#FFFFFF' : '#2B4944',
        sub: dark ? '#D3E0DC' : '#4A5E5A',
        iconBg: dark ? '#FFC800' : '#2B4944',
        iconFg: dark ? '#2B4944' : '#FFC800',
        numColor: dark ? 'rgba(255,255,255,0.3)' : '#C9C0B1',
        cta: dark ? '#FFC800' : '#A84F00'
      });
    });
    const recT = tracksDef.find((t) => t.id === rec);
    return { notice: this.props.notice ?? true, needs, tracks, hasRec: !!recT, recName: recT ? recT.name : '', recHref: recT ? recT.href : '#' };
  }
}
window.Component = Component;
</script>
</head>
<body>
<template id="dc-tpl">

<div dir="rtl" style="font-family: 'IBM Plex Sans Arabic', 'IBM Plex Sans', sans-serif; color: #1F2D2A; background: #F7F2EB; min-height: 100vh; position: relative; overflow-x: hidden">

<header style="position: sticky; top: 0; z-index: 40; background: rgba(36,62,58,0.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 16px 24px">

</div>
</div>
</header>

<section style="background: #2B4944; color: #FFFFFF; padding: 72px 24px 120px; position: relative; overflow: hidden">
<svg class="spin" style="position: absolute; left: -340px; top: -420px; width: 1000px; height: 1000px; opacity: 0.14" viewBox="0 0 1000 1000" aria-hidden="true"><g fill="none" stroke="#FFFFFF" stroke-width="1.2"><circle cx="500" cy="500" r="490"/><circle cx="500" cy="500" r="390"/><circle cx="500" cy="500" r="290"/></g><circle cx="500" cy="10" r="7" fill="#FFC800"/></svg>

<p class="up d1" style="margin: 0 0 14px; font-size: 14px; color: #B9CCC7"><a href="Main.html" style="color: #B9CCC7; text-decoration: none">الرئيسية</a> / خدماتنا</p>

<p class="up d3" style="margin: 22px 0 0; font-size: 19px; line-height: 1.9; color: #D3E0DC; max-width: 640px">استشارات إدارية وقانونية ومحاسبية يقدمها فريق من المختصين وشراكات مهنية — اختر المسار، واحجز، وتابع طلبك من جوالك.</p>

<svg style="position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: 90px" viewBox="0 0 1440 90" preserveAspectRatio="none" aria-hidden="true"><path d="M0 90 Q720 -20 1440 90 Z" fill="#F7F2EB"/><path d="M0 90 Q720 -20 1440 90" fill="none" stroke="#FFC800" stroke-width="3"/></svg>

<section style="padding: 40px 24px 90px; position: relative; z-index: 2">

<p style="margin: 0 0 6px; color: #A84F00; font-weight: 700">— أي مسار يناسبك؟</p>
<h2 style="margin: 0 0 18px; font-size: 28px; color: #2B4944">اختر ما يصف احتياجك، ونرشدك للمسار الأنسب</h2>
<div role="group" aria-label="احتياجك" style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{needs}}" as="q" hint-placeholder-count="4">
<button type="button" class="chip" onClick="{{q.pick}}" aria-pressed="{{q.pressed}}" style="font-family: inherit; font-size: 15px; font-weight: 600; min-height: 46px; padding: 10px 18px; border-radius: 999px; cursor: pointer; border: 1.5px solid #2B4944; background: {{q.bg}}; color: {{q.fg}}">{{q.label}}</button>
</sc-for>
</div>
<sc-if value="{{hasRec}}" hint-placeholder-val="{{ false }}">
<p style="margin: 18px 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; color: #2B4944; font-size: 16px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #FFC800"></span>المسار المقترح: <b>{{recName}}</b> — <a href="{{recHref}}" style="color: #A84F00; font-weight: 700">اطّلع على تفاصيله ←</a></p>
</sc-if>
</div>
</div>
</section>

<section style="padding: 0 24px 100px">
<div style="max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px">
<sc-for list="{{tracks}}" as="t" hint-placeholder-count="3">
<a class="card rv" href="{{t.href}}" style="text-decoration: none; color: {{t.fg}}; background: {{t.bg}}; border-radius: 32px 32px 32px 100px; padding: 40px 34px 52px; display: flex; flex-direction: column; gap: 16px; position: relative; overflow: hidden; outline: 4px solid {{t.ring}}; outline-offset: 4px">
<div style="display: flex; justify-content: space-between; align-items: flex-start"><span style="width: 64px; height: 64px; border-radius: 20px; background: {{t.iconBg}}; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="{{t.iconFg}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"/></svg></span><span style="font-family: 'IBM Plex Sans', sans-serif; font-size: 44px; font-weight: 300; color: {{t.numColor}}">{{t.num}}</span></div>
<sc-if value="{{t.rec}}" hint-placeholder-val="{{ false }}"><span style="align-self: flex-start; background: #FFC800; color: #2B4944; font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 999px">المسار المقترح لك</span></sc-if>
<h2 style="margin: 0; font-size: 28px">{{t.name}}</h2>
<p style="margin: 0; line-height: 1.85; color: {{t.sub}}">{{t.desc}}</p>
<ul style="list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{t.items}}" as="it" hint-placeholder-count="5">
<li style="display: flex; align-items: center; gap: 10px; font-size: 16px"><span style="width: 8px; height: 8px; flex: none; border-radius: 50%; background: #FFC800"></span>{{it}}</li>
</sc-for>
</ul>
<span style="margin-top: 8px; font-weight: 700; color: {{t.cta}}">تفاصيل المسار ←</span>
</a>
</sc-for>
</div>
</div>
</section>

<section style="padding: 0 24px 100px">
<div class="rv" style="max-width: 1240px; margin: 0 auto; background: #233B37; color: #FFFFFF; border-radius: 36px; padding: 56px 44px">
<p style="margin: 0 0 10px; color: #FFC800; font-weight: 700">— كيف تتم الاستشارة</p>
<h2 style="margin: 0 0 36px; font-size: 38px">أربع خطوات واضحة من الطلب إلى الجلسة</h2>
<ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px">
<li style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 22px; padding: 24px"><span style="display: inline-flex; width: 44px; height: 44px; border-radius: 50%; background: #FFC800; color: #2B4944; align-items: center; justify-content: center; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 20px">1</span><h3 style="margin: 14px 0 6px; font-size: 20px">اختر الاستشارة</h3><p style="margin: 0; color: #D3E0DC; line-height: 1.8; font-size: 15px">المسار ونوع الاستشارة وطريقة الجلسة.</p></li>
<li style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 22px; padding: 24px"><span style="display: inline-flex; width: 44px; height: 44px; border-radius: 50%; background: #FFC800; color: #2B4944; align-items: center; justify-content: center; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 20px">2</span><h3 style="margin: 14px 0 6px; font-size: 20px">تحقق برمز</h3><p style="margin: 0; color: #D3E0DC; line-height: 1.8; font-size: 15px">رمز من 4 أرقام يصلك على واتساب.</p></li>

<li style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 22px; padding: 24px"><span style="display: inline-flex; width: 44px; height: 44px; border-radius: 50%; background: #FFC800; color: #2B4944; align-items: center; justify-content: center; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 20px">4</span><h3 style="margin: 14px 0 6px; font-size: 20px">الجلسة</h3><p style="margin: 0; color: #D3E0DC; line-height: 1.8; font-size: 15px">حضوريًا أو عن بُعد، في الموعد المؤكد.</p></li>
</ol>
