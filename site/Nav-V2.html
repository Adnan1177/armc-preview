<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mega: false, track: 0 }; }
  renderVals() {
    const st = this.state;
    const v = { notice: this.props.notice ?? true, mega: st.mega, megaExp: st.mega ? 'true' : 'false', chev: st.mega ? 180 : 0,
      svcFg: st.mega ? '#A84F00' : '#1F2D2A',
      toggleMega: () => this.setState({ mega: !this.state.mega }) };
    [0, 1, 2].forEach((i) => {
      const on = st.track === i;
      v['s' + i] = on; v['p' + i] = on ? 'true' : 'false';
      v['bg' + i] = on ? '#2B4944' : 'transparent';
      v['fg' + i] = on ? '#FFFFFF' : '#2B4944';
      v['ib' + i] = on ? '#365A54' : '#2B4944';
      v['pick' + i] = () => this.setState({ track: i });
    });
    return v;
  }
}
window.Component = Component;
</script>
