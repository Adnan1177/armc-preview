<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أفكار الريادة — النموذج ب (ساطع وداكن)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&amp;family=IBM+Plex+Sans:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0;background:#1A2B28}
.th{--bg:#1A2B28;--bg3:#1E322F;--fg:#FFFFFF;--fg2:#D3E0DC;--fg3:#B9CCC7;--acc:#FFC800;--ln:255,255,255;--hdr:rgba(26,43,40,0.78);--logo:#FFFFFF;--wa:#7FD9A6;--tglow:0 0 40px rgba(255,200,0,0.45);--tglow2:0 0 30px rgba(255,200,0,0.4);--card:rgba(var(--ln),0.05);--drawer:linear-gradient(160deg, rgba(var(--ln),0.08), rgba(var(--ln),0.02));--shadow:0 30px 80px -30px rgba(0,0,0,0.6);--tex:.5}
.th.light{--bg:#F7F2EB;--bg3:#FFFFFF;--fg:#1F2D2A;--fg2:#3E524E;--fg3:#4A5E5A;--acc:#A84F00;--ln:43,73,68;--hdr:rgba(247,242,235,0.86);--logo:#2B4944;--wa:#1E7A47;--tglow:none;--tglow2:none;--card:#FFFFFF;--drawer:#FFFFFF;--shadow:0 30px 70px -36px rgba(43,73,68,0.45);--tex:0}
.th .keepdark,.th.light .keepdark{--bg:#1A2B28;--fg:#FFFFFF;--fg2:#D3E0DC;--fg3:#B9CCC7;--acc:#FFC800;--ln:255,255,255;--logo:#FFFFFF}
.th.light .keepdark{background:#233B37 !important}
.th{transition:background .4s,color .4s}
body:has(.th.light){background:#F7F2EB}
.tgl{display:inline-flex;align-items:center;gap:8px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;border-radius:999px;padding:9px 14px;border:1px solid rgba(var(--ln),0.3);background:rgba(var(--ln),0.06);color:var(--fg);transition:background .25s}
.tgl:hover{background:rgba(var(--ln),0.12)}

a{color:var(--acc)}a:hover{color:var(--fg)}
@keyframes up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.9;transform:scale(1.08)}}
@keyframes breathe{0%,100%{filter:drop-shadow(0 0 18px rgba(255,200,0,.45))}50%{filter:drop-shadow(0 0 42px rgba(255,200,0,.85))}}
@keyframes nodepulse{0%{box-shadow:0 0 0 0 rgba(255,200,0,.6),0 0 30px rgba(255,200,0,.6)}100%{box-shadow:0 0 0 22px rgba(255,200,0,0),0 0 30px rgba(255,200,0,.6)}}
@keyframes drawer{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(37,165,95,.5)}100%{box-shadow:0 0 0 20px rgba(37,165,95,0)}}
@keyframes shine{from{transform:translateX(120%) skewX(-20deg)}to{transform:translateX(-220%) skewX(-20deg)}}
.up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.4s}.d4{animation-delay:.55s}
.spin{animation:spin 100s linear infinite}.spin-r{animation:spin 140s linear infinite reverse}
.glow{animation:glow 7s ease-in-out infinite}
.breathe{animation:breathe 4s ease-in-out infinite}
.node{transition:transform .3s,background .3s,color .3s}.node:hover{transform:scale(1.08)}
.node-on{animation:nodepulse 2s ease-out infinite}
.drawer{animation:drawer .5s cubic-bezier(.2,.7,.2,1) both}
.wa{animation:ring 2.4s ease-out infinite}
.btn{transition:transform .25s ease,box-shadow .25s ease;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px -10px rgba(0,0,0,.5)}
.btn-y::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 3.5s ease-in-out infinite}
.navl{position:relative;transition:color .2s}
.navl::after{content:"";position:absolute;right:0;bottom:-6px;height:2px;width:0;background:#FFC800;transition:width .3s}
.navl:hover{color:var(--acc) !important}.navl:hover::after{width:100%}
.glass{transition:transform .45s cubic-bezier(.2,.7,.2,1),border-color .45s,box-shadow .45s}
.glass:hover{transform:translateY(-8px);border-color:rgba(255,200,0,.55) !important;box-shadow:0 30px 60px -24px rgba(255,200,0,.25)}
@supports (animation-timeline: view()){.rv{animation:up linear both;animation-timeline:view();animation-range:entry 0% entry 45%}}
@media (max-width: 640px){h1{font-size:46px !important}h2{font-size:30px !important}section{padding-left:16px !important;padding-right:16px !important}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { stage: 0, light: true };
  }
  renderVals() {
    const defs = [
      { title: 'طلب', who: 'أنت ← الموقع', desc: 'تختار المسار ونوع الاستشارة، وتكتب اسمك ورقم جوالك. البريد الإلكتروني اختياري.', wa: '—' },
      { title: 'تحقق', who: 'الموقع ← واتساب ← نظام أودو', desc: 'يصلك رمز من 4 أرقام على واتساب. بعد إدخاله يُنشأ طلبك تلقائيًا في نظام إدارة العملاء برقم خاص.', wa: 'مرحبًا [الاسم]، تم استلام طلبك رقم [#ARMC-____]، وسيتواصل معك فريقنا قريبًا.' },
      { title: 'مراجعة', who: 'فريق أفكار الريادة', desc: 'يُسند طلبك إلى المستشار المختص، ويحدد نطاق الاستشارة وتكلفتها قبل أي التزام منك.', wa: 'طلبك رقم [#ARMC-____] قيد المراجعة لدى المستشار المختص.' },
      { title: 'دفع', who: 'نظام أودو ← بوابة الدفع', desc: 'بعد الموافقة يصلك رابط دفع آمن بالمبلغ المحدد، وتستطيع الدفع أيضًا من صفحة «تابع طلبك».', wa: 'تمت الموافقة على طلبك. رابط السداد: [رابط الدفع] بمبلغ [المبلغ] ريال.' },
      { title: 'استشارة', who: 'الجلسة والمتابعة', desc: 'يتأكد موعدك فور اكتمال الدفع، وبعد الجلسة يُغلق الطلب ويصلك رابط لتقييم الخدمة.', wa: 'تم تأكيد السداد. موعد استشارتك: [التاريخ والوقت]. نراك قريبًا.' }
    ];
    defs[0].wa = 'رمز الدخول إلى بوابة أفكار الريادة هو [____]، وصالح لمدة 5 دقائق.';
    const pos = [[244, 24], [453, 176], [373, 422], [115, 422], [35, 176]];
    const lab = [[220, 104], [429, 256], [349, 502], [91, 502], [11, 256]];
    const cur = this.state.stage;
    const nodes = defs.map((d, i) => {
      const on = i === cur, done = i < cur;
      return {
        num: String(i + 1), title: d.title,
        aria: 'المحطة ' + (i + 1) + ': ' + d.title,
        pressed: on ? 'true' : 'false',
        cls: on ? 'node-on' : '',
        left: pos[i][0], top: pos[i][1], labelLeft: lab[i][0], labelTop: lab[i][1],
        bg: on ? '#FFC800' : (done ? 'rgba(255,200,0,0.18)' : 'rgba(var(--ln),0.06)'),
        fg: on ? '#1A2B28' : (done ? 'var(--acc)' : 'var(--fg)'),
        border: on ? '#FFC800' : (done ? 'rgba(255,200,0,0.6)' : 'rgba(var(--ln),0.25)'),
        labelColor: on ? 'var(--acc)' : 'var(--fg3)',
        pick: () => this.setState({ stage: i })
      };
    });
    return {
      notice: this.props.notice ?? true,
      nodes, cur: defs[cur], curNum: String(cur + 1),
      isLight: this.state.light, isDark: !this.state.light, themeCls: this.state.light ? 'light' : '',
      lightPressed: this.state.light ? 'true' : 'false',
      themeLabel: this.state.light ? 'الوضع الداكن' : 'الوضع الساطع',
      toggleTheme: () => this.setState({ light: !this.state.light }),
      next: () => this.setState({ stage: (cur + 1) % 5 }),
      prev: () => this.setState({ stage: (cur + 4) % 5 })
    };
  }
}
window.Component = Component;
</script>
</head>
<body>
<template id="dc-tpl">

<div dir="rtl" class="th {{themeCls}}" style="font-family: 'IBM Plex Sans Arabic', 'IBM Plex Sans', sans-serif; color: var(--fg); background: var(--bg); min-height: 100vh; position: relative; overflow-x: hidden">

<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; opacity: var(--tex); background: repeating-radial-gradient(circle at 30% 20%, rgba(var(--ln),0.025) 0 1px, transparent 1px 3px)"></div>

<sc-if value="{{notice}}" hint-placeholder-val="{{ true }}">
<div role="note" style="position: relative; background: #0F1B19; color: var(--acc); padding: 8px 24px; text-align: center; font-size: 13px; line-height: 1.7">تصميم أولي للعرض فقط — جميع الحقوق محفوظة © 2026 للمهندس عدنان البنا.</div>
</sc-if>

<header style="position: sticky; top: 0; z-index: 40; background: var(--hdr); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid rgba(var(--ln),0.08); padding: 16px 24px">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="Main.html" aria-label="أفكار الريادة — الرئيسية" style="display: flex; align-items: center"><svg width="124" height="44" viewBox="0 0 545 192" role="img" aria-label="أفكار الريادة"><path d="M107 0H131Q135 0 135 4V30Q135 61 172 64.5L232 72H103V4Q103 0 107 0Z" fill="#FFC800"/><path d="M107 0H131Q135 0 135 4V30Q135 61 172 64.5L232 72H103V4Q103 0 107 0Z" fill="#FFC800" transform="rotate(180 116 72)"/><text x="146" y="188" direction="ltr" unicode-bidi="bidi-override" textLength="392" lengthAdjust="spacingAndGlyphs" font-family="IBM Plex Sans, sans-serif" font-size="172" font-weight="500" letter-spacing="-3" style="fill: var(--logo)">armc</text></svg></a>
<nav aria-label="القائمة الرئيسية" style="display: flex; flex-wrap: wrap; gap: 30px; font-size: 16px">
<a class="navl" href="Main.html" style="color: var(--acc); text-decoration: none; font-weight: 600">الرئيسية</a>
<a class="navl" href="About.html" style="color: var(--fg); text-decoration: none">من نحن</a>
<a class="navl" href="Services.html" style="color: var(--fg); text-decoration: none">خدماتنا</a>
<a class="navl" href="Contact.html" style="color: var(--fg); text-decoration: none">تواصل معنا</a>
</nav>
<div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
<button type="button" class="tgl" onClick="{{toggleTheme}}" aria-pressed="{{lightPressed}}" aria-label="تبديل الوضع الساطع والداكن"><sc-if value="{{isLight}}" hint-placeholder-val="{{ true }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></sc-if><sc-if value="{{isDark}}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></sc-if>{{themeLabel}}</button>
<a class="btn" href="Track.html" style="color: var(--fg); text-decoration: none; font-weight: 500; padding: 11px 20px; border-radius: 999px; font-size: 15px; border: 1px solid rgba(var(--ln),0.35)">تابع طلبك</a>
<a class="btn btn-y" href="Booking.html" style="background: #FFC800; color: #1A2B28; text-decoration: none; font-weight: 700; padding: 12px 22px; border-radius: 999px; font-size: 15px">احجز استشارة</a>
</div>
</div>
</header>

<section style="position: relative; padding: 110px 24px 120px; overflow: hidden">
<div class="glow" aria-hidden="true" style="position: absolute; left: 6%; top: 40px; width: 620px; height: 620px; border-radius: 50%; background: radial-gradient(circle, rgba(255,200,0,0.28) 0%, rgba(255,200,0,0.08) 40%, transparent 70%)"></div>
<div class="glow" aria-hidden="true" style="position: absolute; right: -200px; bottom: -260px; width: 560px; height: 560px; border-radius: 50%; background: radial-gradient(circle, rgba(217,108,0,0.22) 0%, transparent 65%); animation-delay: -3s"></div>
<svg class="spin" aria-hidden="true" style="position: absolute; left: 4%; top: -40px; width: 700px; height: 700px; opacity: 0.18" viewBox="0 0 700 700"><g fill="none" stroke="#FFC800" stroke-width="1"><circle cx="350" cy="350" r="340"/><circle cx="350" cy="350" r="260"/><circle cx="350" cy="350" r="180"/></g><circle cx="350" cy="10" r="5" fill="#FFC800"/><circle cx="610" cy="350" r="4" fill="#FFC800"/></svg>
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 48px; position: relative">
<div style="flex: 1.4 1 520px; min-width: 0">
<p class="up d1" style="margin: 0 0 26px; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; letter-spacing: 4px; color: var(--acc); font-weight: 600">ARMC · <span style="font-family: 'IBM Plex Sans Arabic', sans-serif; letter-spacing: 0; font-size: 15px">أفكار الريادة للاستشارات</span></p>
<h1 class="up d2" style="margin: 0; font-size: 96px; line-height: 1.12; font-weight: 700; letter-spacing: -1px">سؤالك.<br><span style="color: var(--fg3); font-weight: 300">رأي مختص.</span><br><span style="color: var(--acc); text-shadow: var(--tglow)">قرار أوضح.</span></h1>
<p class="up d3" style="margin: 32px 0 0; font-size: 20px; line-height: 1.9; color: var(--fg2); max-width: 560px">استشارات إدارية وقانونية ومحاسبية تحجزها في دقيقتين، وتتابعها من جوالك حتى موعد الجلسة، وكل تحديث يصلك على واتساب.</p>
<div class="up d4" style="display: flex; flex-wrap: wrap; gap: 14px; margin-top: 40px">
<a class="btn btn-y" href="Booking.html" style="background: #FFC800; color: #1A2B28; text-decoration: none; font-weight: 700; padding: 18px 34px; border-radius: 999px; font-size: 17px; box-shadow: 0 0 40px rgba(255,200,0,0.35)">احجز استشارتك</a>
<a class="btn" href="#loop" style="color: var(--fg); text-decoration: none; font-weight: 500; padding: 17px 30px; border-radius: 999px; font-size: 17px; border: 1px solid rgba(var(--ln),0.3); background: rgba(var(--ln),0.04)">كيف يمر طلبك؟</a>
</div>
</div>
<div class="up d3" style="flex: 1 1 380px; min-width: 0; display: flex; align-items: center; justify-content: center; min-height: 440px; position: relative">
<div aria-hidden="true" style="position: absolute; width: 360px; height: 360px; border-radius: 50%; border: 1px solid rgba(255,200,0,0.25); box-shadow: inset 0 0 80px rgba(255,200,0,0.12), 0 0 120px rgba(255,200,0,0.12)"></div>
<div aria-hidden="true" style="position: absolute; width: 250px; height: 250px; border-radius: 50%; border: 1px solid rgba(var(--ln),0.12); background: radial-gradient(circle, rgba(255,200,0,0.14), transparent 70%)"></div>
<svg class="breathe" style="position: relative; width: 230px; height: 144px" viewBox="0 0 233 146" aria-hidden="true"><path d="M107 0H131Q135 0 135 4V30Q135 61 172 64.5L232 72H103V4Q103 0 107 0Z" fill="#FFC800"/><path d="M107 0H131Q135 0 135 4V30Q135 61 172 64.5L232 72H103V4Q103 0 107 0Z" fill="#FFC800" transform="rotate(180 116 72)"/></svg>
<span style="position: absolute; top: 34px; right: 10px; background: rgba(var(--ln),0.07); border: 1px solid rgba(var(--ln),0.14); backdrop-filter: blur(10px); border-radius: 999px; padding: 8px 16px; font-size: 14px; color: var(--fg2)">إدارية</span>
<span style="position: absolute; bottom: 70px; right: 0; background: rgba(var(--ln),0.07); border: 1px solid rgba(var(--ln),0.14); backdrop-filter: blur(10px); border-radius: 999px; padding: 8px 16px; font-size: 14px; color: var(--fg2)">قانونية</span>
<span style="position: absolute; top: 120px; left: 0; background: rgba(var(--ln),0.07); border: 1px solid rgba(var(--ln),0.14); backdrop-filter: blur(10px); border-radius: 999px; padding: 8px 16px; font-size: 14px; color: var(--fg2)">محاسبية وضريبية</span>
</div>
</div>
</section>

<section style="position: relative; padding: 0 24px 40px">
<div class="rv" style="max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1px; background: rgba(var(--ln),0.1); border: 1px solid rgba(var(--ln),0.1); border-radius: 24px; overflow: hidden">
<div style="background: var(--bg3); padding: 26px 28px"><p style="margin: 0 0 6px; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; letter-spacing: 3px; color: var(--acc)">INPUT</p><p style="margin: 0; font-size: 17px; color: var(--fg2)">طلب من الموقع أو واتساب</p></div>
<div style="background: var(--bg3); padding: 26px 28px"><p style="margin: 0 0 6px; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; letter-spacing: 3px; color: var(--acc)">VERIFY</p><p style="margin: 0; font-size: 17px; color: var(--fg2)">تحقق برمز على جوالك</p></div>
<div style="background: var(--bg3); padding: 26px 28px"><p style="margin: 0 0 6px; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; letter-spacing: 3px; color: var(--acc)">ODOO</p><p style="margin: 0; font-size: 17px; color: var(--fg2)">طلبك في نظامنا لحظيًا</p></div>
<div style="background: var(--bg3); padding: 26px 28px"><p style="margin: 0 0 6px; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; letter-spacing: 3px; color: var(--acc)">NOTIFY</p><p style="margin: 0; font-size: 17px; color: var(--fg2)">كل تحديث يصلك على واتساب</p></div>
</div>
</section>

<section id="loop" style="position: relative; padding: 110px 24px">
<div style="max-width: 1240px; margin: 0 auto">
<div class="rv" style="text-align: center; margin-bottom: 56px">
<p style="margin: 0 0 14px; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; letter-spacing: 4px; color: var(--acc)">THE LOOP · <span style="font-family: 'IBM Plex Sans Arabic', sans-serif; letter-spacing: 0; font-size: 15px">رحلة طلبك</span></p>
<h2 style="margin: 0; font-size: 52px; line-height: 1.25">خمس محطات. <span style="color: var(--acc)">ولا خطوة مجهولة.</span></h2>
<p style="margin: 16px auto 0; max-width: 560px; color: var(--fg3); line-height: 1.8; font-size: 17px">اضغط على أي محطة لتعرف ما يحدث فيها، والرسالة التي تصلك تلقائيًا.</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 48px; align-items: center; justify-content: center">
<div style="flex: 0 0 auto; position: relative; width: 560px; max-width: 100%; height: 560px">
<svg class="spin-r" aria-hidden="true" style="position: absolute; inset: 0; width: 560px; height: 560px" viewBox="0 0 560 560"><circle cx="280" cy="280" r="220" fill="none" stroke="rgba(255,200,0,0.35)" stroke-width="1.5" stroke-dasharray="4 10"/><circle cx="280" cy="280" r="150" fill="none" stroke="rgba(var(--ln),0.08)"/></svg>
<div aria-hidden="true" style="position: absolute; left: 160px; top: 160px; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, rgba(255,200,0,0.22), transparent 70%)"></div>
<div style="position: absolute; left: 180px; top: 200px; width: 200px; text-align: center">
<svg style="width: 86px; height: 54px" viewBox="0 0 233 146" aria-hidden="true"><path d="M107 0H131Q135 0 135 4V30Q135 61 172 64.5L232 72H103V4Q103 0 107 0Z" fill="#FFC800"/><path d="M107 0H131Q135 0 135 4V30Q135 61 172 64.5L232 72H103V4Q103 0 107 0Z" fill="#FFC800" transform="rotate(180 116 72)"/></svg>
<p style="margin: 14px 0 0; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; letter-spacing: 3px; color: var(--fg3)">STAGE {{curNum}} / 5</p>
<p style="margin: 4px 0 0; font-size: 24px; font-weight: 700; color: var(--acc)">{{cur.title}}</p>
</div>
<sc-for list="{{nodes}}" as="n" hint-placeholder-count="5">
<button type="button" class="node {{n.cls}}" onClick="{{n.pick}}" aria-label="{{n.aria}}" aria-pressed="{{n.pressed}}" style="position: absolute; left: {{n.left}}px; top: {{n.top}}px; width: 72px; height: 72px; border-radius: 50%; cursor: pointer; font-family: 'IBM Plex Sans', sans-serif; font-size: 24px; font-weight: 600; border: 1px solid {{n.border}}; background: {{n.bg}}; color: {{n.fg}}">{{n.num}}</button>
<span aria-hidden="true" style="position: absolute; left: {{n.labelLeft}}px; top: {{n.labelTop}}px; width: 120px; text-align: center; font-size: 15px; font-weight: 600; color: {{n.labelColor}}">{{n.title}}</span>
</sc-for>
