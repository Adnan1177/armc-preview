<style>
body{margin:0;background:#F7F2EB}
a{color:#2B4944}a:hover{color:#D96C00}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shine{from{transform:translateX(120%) skewX(-20deg)}to{transform:translateX(-220%) skewX(-20deg)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(37,165,95,.5)}100%{box-shadow:0 0 0 20px rgba(37,165,95,0)}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.up{animation:up .8s cubic-bezier(.2,.7,.2,1) both}.d1{animation-delay:.1s}.d2{animation-delay:.22s}.d3{animation-delay:.34s}
.spin{animation:spin 110s linear infinite}
.navl{position:relative;transition:color .2s}
.navl::after{content:"";position:absolute;right:0;bottom:-6px;height:2px;width:0;background:#FFC800;transition:width .3s}
.navl:hover{color:#FFC800 !important}.navl:hover::after{width:100%}
.btn{transition:transform .25s,box-shadow .25s;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px -10px rgba(0,0,0,.35)}
.btn-y::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 3.6s ease-in-out infinite}
.card{transition:transform .4s cubic-bezier(.2,.7,.2,1),box-shadow .4s}
.card:hover{transform:translateY(-6px);box-shadow:0 26px 50px -24px rgba(43,73,68,.45)}
.wa{animation:ring 2.2s ease-out infinite}
.pop{animation:pop .5s cubic-bezier(.3,1.5,.5,1) both}
input,select,textarea{transition:border-color .2s,box-shadow .2s;outline:none}
input:focus,select:focus,textarea:focus{border-color:#FFC800 !important;box-shadow:0 0 0 4px rgba(255,200,0,.25)}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { name: '', phone: '', sent: false };
  }
  renderVals() {
    const s = this.state;
    const ok = s.name.trim().length > 1 && s.phone.replace(/\D/g, '').length >= 9;
    return {
      notice: this.props.notice ?? true,
      name: s.name, phone: s.phone,
      sent: s.sent, notSent: !s.sent,
      cantSend: !ok,
      sendBg: ok ? '#2B4944' : '#C9CFCC',
      sendFg: ok ? '#FFFFFF' : '#4A5E5A',
      setName: (e) => this.setState({ name: e.target.value }),
      setPhone: (e) => this.setState({ phone: e.target.value }),
      send: () => { if (ok) this.setState({ sent: true }); },
      reset: () => this.setState({ name: '', phone: '', sent: false })
    };
  }
}
window.Component = Component;
</script>
</head>
