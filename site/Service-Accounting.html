<style>
body{margin:0;background:#F7F2EB}
a{color:#2B4944}a:hover{color:#D96C00}
@keyframes up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(37,165,95,.5)}100%{box-shadow:0 0 0 20px rgba(37,165,95,0)}}
@keyframes shine{from{transform:translateX(120%) skewX(-20deg)}to{transform:translateX(-220%) skewX(-20deg)}}
.up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.4s}
.spin{animation:spin 90s linear infinite}
.wa{animation:ring 2.4s ease-out infinite}
.btn{transition:transform .25s ease,box-shadow .25s ease;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px -10px rgba(0,0,0,.35)}
.btn-y::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 3.5s ease-in-out infinite}
.navl{position:relative;transition:color .2s}
.navl::after{content:"";position:absolute;right:0;bottom:-6px;height:2px;width:0;background:#FFC800;transition:width .3s}
.navl:hover{color:#FFC800 !important}.navl:hover::after{width:100%}
.svc{transition:transform .4s cubic-bezier(.2,.7,.2,1),box-shadow .4s,border-color .4s}
.svc:hover{transform:translateY(-6px);box-shadow:0 26px 50px -24px rgba(43,73,68,.45)}
.tile{transition:transform .35s}.tile:hover{transform:translateY(-4px)}
@supports (animation-timeline: view()){.rv{animation:up linear both;animation-timeline:view();animation-range:entry 0% entry 45%}}
@media (max-width: 640px){h1{font-size:40px !important}h2{font-size:30px !important}section{padding-left:16px !important;padding-right:16px !important}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: 0, faq: -1 };
  }
  renderVals() {
    const defs = [
      { title: 'الاستشارات الضريبية', desc: 'فهم التزاماتك الضريبية وتجنب المخالفات.', points: ['مراجعة الوضع الضريبي الحالي', 'توضيح متطلبات ضريبة القيمة المضافة والزكاة', 'توصيات لتنظيم الإقرارات والمواعيد'] },
      { title: 'مسك الدفاتر', desc: 'تسجيل منتظم للعمليات المالية وفق الأصول.', points: ['تنظيم القيود والمستندات', 'تسويات دورية للحسابات', 'تقارير مالية شهرية مبسطة'] },
      { title: 'بناء شجرة الحسابات', desc: 'دليل حسابات يناسب نشاطك ويسهّل التقارير.', points: ['تصميم دليل الحسابات حسب النشاط', 'ربط الحسابات بالتقارير المطلوبة', 'إرشادات استخدام للفريق المالي'] },
      { title: 'بناء وتطوير النظام المحاسبي', desc: 'نظام محاسبي واضح الإجراءات والصلاحيات.', points: ['تصميم الدورة المستندية', 'تحديد الإجراءات والصلاحيات المالية', 'توصيات الأنظمة والأدوات المناسبة'] },
      { title: 'الفحص والتدقيق المالي الداخلي', desc: 'فحص مستقل يكشف الأخطاء ومواضع الخلل.', points: ['فحص عينات من العمليات والمستندات', 'تحديد مواطن الضعف في الرقابة', 'تقرير بالملاحظات والتوصيات'] }
    ];
    const items = defs.map((d, i) => {
      const o = this.state.open === i;
      return { ...d, n: String(i + 1).padStart(2, '0'), isOpen: o, expanded: o ? 'true' : 'false', sign: o ? '−' : '+', bg: o ? '#FFFFFF' : '#FFFFFF', border: o ? '#FFC800' : '#E6DFD3', toggle: () => this.setState({ open: o ? -1 : i }) };
    });
    const fdefs = [
      { q: 'كم مدة الاستشارة؟', a: 'تتراوح مدة الجلسة عادة بين [المدة]، وتُحدد بدقة بعد مراجعة طلبك.' },
      { q: 'كم تكلفة الاستشارة؟', a: 'تبدأ الأسعار من [السعر] ريال، ويصلك المبلغ النهائي مع رابط الدفع بعد المراجعة وقبل أي التزام.' },
      { q: 'هل الجلسة حضورية أم عن بُعد؟', a: 'تختار عند الحجز بين الحضور في المكتب أو الاتصال المرئي أو المكالمة الهاتفية.' },
      { q: 'كيف أتابع طلبي؟', a: 'تصلك كل التحديثات على واتساب تلقائيًا، ويمكنك الدخول إلى صفحة «تابع طلبك» برقم جوالك ورمز التحقق في أي وقت.' }
    ];
    const faqs = fdefs.map((f, i) => {
      const o = this.state.faq === i;
      return { ...f, isOpen: o, expanded: o ? 'true' : 'false', sign: o ? '−' : '+', border: o ? '#FFC800' : '#E6DFD3', toggle: () => this.setState({ faq: o ? -1 : i }) };
    });
    return { notice: this.props.notice ?? true, items, faqs };
  }
}
window.Component = Component;
</script>
</head>
