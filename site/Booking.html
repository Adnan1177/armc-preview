<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أفكار الريادة — احجز استشارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&amp;family=IBM+Plex+Sans:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F7F2EB}
a{color:#2B4944}a:hover{color:#D96C00}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,200,0,.55)}100%{box-shadow:0 0 0 16px rgba(255,200,0,0)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(37,165,95,.5)}100%{box-shadow:0 0 0 20px rgba(37,165,95,0)}}
@keyframes shine{from{transform:translateX(120%) skewX(-20deg)}to{transform:translateX(-220%) skewX(-20deg)}}
.up{animation:up .7s cubic-bezier(.2,.7,.2,1) both}
.pop{animation:pop .6s cubic-bezier(.3,1.5,.5,1) both}
.spin{animation:spin 90s linear infinite}
.pulse{animation:pulse 2.2s ease-out infinite}
.wa{animation:ring 2.4s ease-out infinite}
.btn{transition:transform .25s ease,box-shadow .25s ease;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px -10px rgba(0,0,0,.3)}
.btn-y::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 3.5s ease-in-out infinite}
.navl{position:relative;transition:color .2s}
.navl::after{content:"";position:absolute;right:0;bottom:-6px;height:2px;width:0;background:#FFC800;transition:width .3s}
.navl:hover{color:#FFC800 !important}.navl:hover::after{width:100%}
.opt{transition:border-color .25s,background .25s,transform .25s,box-shadow .25s}
.opt:hover{transform:translateY(-3px);box-shadow:0 16px 30px -18px rgba(43,73,68,.45)}
input,select,textarea{transition:border-color .2s,box-shadow .2s;outline:none}
input:focus,select:focus,textarea:focus{border-color:#FFC800 !important;box-shadow:0 0 0 4px rgba(255,200,0,.25)}
@media (max-width: 640px){h1{font-size:36px !important}h2{font-size:24px !important}section{padding-left:16px !important;padding-right:16px !important}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 1, track: 'mgmt', item: 0, method: 'video', name: '', phone: '', email: '', note: '', err: false };
  }
  renderVals() {
    const st = this.state;
    const catalog = {
      mgmt: { label: 'الاستشارات الإدارية', items: ['الاستراتيجية وتطوير الأعمال', 'التأسيس والتنظيم الإداري', 'الهياكل التنظيمية والسياسات والإجراءات', 'التشغيل وتحسين العمليات', 'إدارة المخاطر واستمرارية الأعمال', 'الأداء ومؤشرات الأداء'] },
      legal: { label: 'الاستشارات القانونية', items: ['الاستشارات القانونية العامة', 'مراجعة وصياغة العقود والاتفاقيات', 'استشارات النزاعات والمطالبات', 'استشارات الأراضي والعقارات', 'استشارات التركات والميراث', 'استشارات الشركات والأنظمة التجارية'] },
      acc: { label: 'المحاسبية والضريبية', items: ['الاستشارات الضريبية', 'مسك الدفاتر', 'بناء شجرة الحسابات', 'بناء وتطوير النظام المحاسبي', 'الفحص والتدقيق المالي الداخلي'] }
    };
    const methodDefs = [{ id: 'office', label: 'حضوري' }, { id: 'video', label: 'اتصال مرئي' }, { id: 'call', label: 'مكالمة' }];
    const tr = catalog[st.track];
    const itemIdx = Math.min(st.item, tr.items.length - 1);
    const stepDefs = [['اختر الاستشارة', 'الخطوة 1'], ['بياناتك', 'الخطوة 2'], ['التحقق', 'الخطوة 3'], ['تم الاستلام', 'الخطوة 4']];
    const steps = stepDefs.map((d, i) => {
      const n = i + 1, cur = n === st.step, done = n < st.step;
      return {
        num: done ? '✓' : String(n), label: d[0], sub: d[1],
        bg: cur ? '#FFC800' : (done ? '#2B4944' : '#E6E0D5'),
        fg: cur ? '#2B4944' : (done ? '#FFC800' : '#5A6B67'),
        cardBg: cur ? '#FFFFFF' : 'rgba(255,255,255,0.55)',
        cardBorder: cur ? '#FFC800' : '#E3DCCF',
        shadow: cur ? '0 18px 36px -22px rgba(43,73,68,0.55)' : 'none',
        labelFg: '#2B4944', subFg: '#5A6B67', cls: cur ? 'pulse' : ''
      };
    });
    const tracks = Object.keys(catalog).map((k) => ({
      label: catalog[k].label, pressed: st.track === k ? 'true' : 'false',
      bg: st.track === k ? '#2B4944' : '#FFFFFF', fg: st.track === k ? '#FFFFFF' : '#2B4944',
      pick: () => this.setState({ track: k, item: 0 })
    }));
    const items = tr.items.map((label, i) => {
      const sel = i === itemIdx;
      return {
        label, pressed: sel ? 'true' : 'false',
        bg: sel ? '#FFF8DD' : '#FFFFFF', border: sel ? '#FFC800' : '#E3DCCF',
        dot: sel ? '#2B4944' : '#C9C0B1', dotFill: sel ? '#2B4944' : 'transparent',
        pick: () => this.setState({ item: i })
      };
    });
    const methods = methodDefs.map((m) => ({
      label: m.label, pressed: st.method === m.id ? 'true' : 'false',
      bg: st.method === m.id ? '#FFF8DD' : '#FFFFFF', border: st.method === m.id ? '#FFC800' : '#E3DCCF',
      pick: () => this.setState({ method: m.id })
    }));
    const ready = st.name.trim().length > 0 && st.phone.trim().length > 0;
    const lifeDefs = ['طلب جديد', 'قيد المراجعة', 'بانتظار الدفع', 'مؤكد ومجدول', 'مكتمل'];
    const life = lifeDefs.map((t, i) => ({
      n: String(i + 1), title: t, cls: i === 0 ? 'pulse' : '',
      bg: i === 0 ? '#FFC800' : '#E6E0D5', fg: i === 0 ? '#2B4944' : '#5A6B67', tc: i === 0 ? '#2B4944' : '#5A6B67'
    }));
    const method = methodDefs.find((m) => m.id === st.method);
    const nameShown = st.name.trim() ? st.name.trim() : '—';
    return {
      notice: this.props.notice ?? true,
      steps, tracks, items, methods, life,
      isStep1: st.step === 1, isStep2: st.step === 2, isStep3: st.step === 3, isStep4: st.step === 4,
      name: st.name, phone: st.phone, email: st.email,
      trackLabel: tr.label, itemLabel: tr.items[itemIdx], methodLabel: method ? method.label : '',
      nameShown, firstName: st.name.trim() ? st.name.trim().split(' ')[0] : '[الاسم]',
      showErr: st.err && !ready,
      notReady: ready ? 'false' : 'true',
      sendBg: ready ? '#2B4944' : '#C9CFCC', sendFg: ready ? '#FFFFFF' : '#4A5E5A',
      setName: (e) => this.setState({ name: e.target.value }),
      setPhone: (e) => this.setState({ phone: e.target.value }),
      setEmail: (e) => this.setState({ email: e.target.value }),
      setNote: (e) => this.setState({ note: e.target.value }),
      next: () => this.setState({ step: 2 }),
      back: () => this.setState({ step: Math.max(1, st.step - 1), err: false }),
      sendOtp: () => { if (ready) this.setState({ step: 3, err: false }); else this.setState({ err: true }); },
      verify: () => this.setState({ step: 4 })
    };
  }
}
window.Component = Component;
</script>
</head>
<body>
<template id="dc-tpl">

<div dir="rtl" style="font-family: 'IBM Plex Sans Arabic', 'IBM Plex Sans', sans-serif; color: #1F2D2A; background: #F7F2EB; min-height: 100vh; position: relative; overflow-x: hidden">

<sc-if value="{{notice}}" hint-placeholder-val="{{ true }}">
<div role="note" style="background: #1A2B28; color: #FFC800; padding: 8px 24px; text-align: center; font-size: 13px; line-height: 1.7">تصميم أولي للعرض فقط — جميع الحقوق محفوظة © 2026 للمهندس عدنان البنا.</div>
</sc-if>

<header style="position: sticky; top: 0; z-index: 40; background: rgba(36,62,58,0.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 16px 24px">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="Main.html" aria-label="أفكار الريادة — الرئيسية" style="display: flex; align-items: center"><svg width="124" height="44" viewBox="0 0 545 192" role="img" aria-label="أفكار الريادة"><path d="M107 0H131Q135 0 135 4V30Q135 61 172 64.5L232 72H103V4Q103 0 107 0Z" fill="#FFC800"/><path d="M107 0H131Q135 0 135 4V30Q135 61 172 64.5L232 72H103V4Q103 0 107 0Z" fill="#FFC800" transform="rotate(180 116 72)"/><text x="146" y="188" direction="ltr" unicode-bidi="bidi-override" textLength="392" lengthAdjust="spacingAndGlyphs" font-family="IBM Plex Sans, sans-serif" font-size="172" font-weight="500" letter-spacing="-3" fill="#FFFFFF">armc</text></svg></a>
<nav aria-label="القائمة الرئيسية" style="display: flex; flex-wrap: wrap; gap: 30px; font-size: 16px">
<a class="navl" href="Main.html" style="color: #FFFFFF; text-decoration: none">الرئيسية</a>
<a class="navl" href="About.html" style="color: #FFFFFF; text-decoration: none">من نحن</a>
<a class="navl" href="Services.html" style="color: #FFFFFF; text-decoration: none">خدماتنا</a>
<a class="navl" href="Contact.html" style="color: #FFFFFF; text-decoration: none">تواصل معنا</a>
</nav>
<div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
<a class="btn" href="Track.html" style="color: #FFFFFF; text-decoration: none; font-weight: 500; padding: 11px 20px; border-radius: 999px; font-size: 15px; border: 1px solid rgba(255,255,255,0.4)">تابع طلبك</a>
<a class="btn btn-y" href="Booking.html" style="background: #FFC800; color: #2B4944; text-decoration: none; font-weight: 700; padding: 12px 22px; border-radius: 999px; font-size: 15px">احجز استشارة</a>
</div>
</div>
</header>

<section style="background: #2B4944; color: #FFFFFF; padding: 56px 24px 120px; position: relative; overflow: hidden">
<svg class="spin" style="position: absolute; left: -300px; top: -380px; width: 900px; height: 900px; opacity: 0.14" viewBox="0 0 900 900" aria-hidden="true"><g fill="none" stroke="#FFFFFF" stroke-width="1.2"><circle cx="450" cy="450" r="440"/><circle cx="450" cy="450" r="340"/><circle cx="450" cy="450" r="240"/></g><circle cx="450" cy="10" r="6" fill="#FFC800"/></svg>
<div style="max-width: 1240px; margin: 0 auto; position: relative">
<p class="up" style="margin: 0 0 12px; font-size: 14px; color: #B9CCC7"><a href="Main.html" style="color: #B9CCC7; text-decoration: none">الرئيسية</a> / احجز استشارة</p>
<h1 class="up" style="margin: 0; font-size: 52px; line-height: 1.3">احجز استشارتك في دقيقتين</h1>
<p class="up" style="margin: 14px 0 0; font-size: 19px; line-height: 1.9; color: #D3E0DC; max-width: 680px">اختر الاستشارة، اكتب بياناتك، وأكّد رقم جوالك برمز تحقق يصلك على واتساب. يراجع فريقنا طلبك ويرسل لك رابط الدفع بعد الموافقة.</p>
</div>
</section>

<section style="padding: 0 24px 96px; margin-top: -72px; position: relative; z-index: 2">
<div style="max-width: 1240px; margin: 0 auto">

<ol aria-label="خطوات الحجز" style="list-style: none; margin: 0 0 24px; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
<li style="display: flex; align-items: center; gap: 12px; background: {{s.cardBg}}; border: 1px solid {{s.cardBorder}}; border-radius: 18px; padding: 14px 16px; box-shadow: {{s.shadow}}">
<span class="{{s.cls}}" style="width: 38px; height: 38px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-family: 'IBM Plex Sans', sans-serif; background: {{s.bg}}; color: {{s.fg}}">{{s.num}}</span>
<span style="display: flex; flex-direction: column"><span style="font-size: 12px; color: {{s.subFg}}">{{s.sub}}</span><span style="font-weight: 700; color: {{s.labelFg}}">{{s.label}}</span></span>
</li>
</sc-for>
</ol>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

<div style="flex: 2 1 560px; min-width: 0; background: #FFFFFF; border-radius: 28px; padding: 40px 36px; box-sizing: border-box; box-shadow: 0 30px 60px -40px rgba(43,73,68,0.45)">

<sc-if value="{{isStep1}}" hint-placeholder-val="{{ true }}">
<div class="up">
<h2 style="margin: 0 0 6px; font-size: 28px; color: #2B4944">اختر الاستشارة</h2>
<p style="margin: 0 0 24px; color: #4A5E5A">حدد المسار، ثم نوع الاستشارة، وطريقة الجلسة المفضّلة.</p>
<div role="group" aria-label="المسار" style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px">
<sc-for list="{{tracks}}" as="t" hint-placeholder-count="3">
<button type="button" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" class="btn" style="font-family: inherit; font-size: 16px; font-weight: 600; padding: 12px 22px; min-height: 48px; border-radius: 999px; cursor: pointer; border: 1.5px solid #2B4944; background: {{t.bg}}; color: {{t.fg}}">{{t.label}}</button>
</sc-for>
</div>
<div role="group" aria-label="نوع الاستشارة" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-bottom: 28px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="6">
<button type="button" onClick="{{it.pick}}" aria-pressed="{{it.pressed}}" class="opt" style="font-family: inherit; text-align: right; display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 14px 16px; border-radius: 18px; cursor: pointer; border: 2px solid {{it.border}}; background: {{it.bg}}; color: #2B4944; font-size: 16px; font-weight: 600">
<span style="width: 22px; height: 22px; flex: none; border-radius: 50%; border: 2px solid {{it.dot}}; background: {{it.dotFill}}"></span>{{it.label}}</button>
</sc-for>
</div>
<h3 style="margin: 0 0 12px; font-size: 18px; color: #2B4944">طريقة الجلسة</h3>
<div role="group" aria-label="طريقة الجلسة" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px">
<sc-for list="{{methods}}" as="m" hint-placeholder-count="3">
<button type="button" onClick="{{m.pick}}" aria-pressed="{{m.pressed}}" class="opt" style="font-family: inherit; min-height: 56px; border-radius: 16px; cursor: pointer; font-size: 16px; font-weight: 600; color: #2B4944; background: {{m.bg}}; border: 2px solid {{m.border}}">{{m.label}}</button>
</sc-for>
</div>
<button type="button" onClick="{{next}}" class="btn" style="margin-top: 32px; width: 100%; min-height: 56px; font-family: inherit; font-size: 17px; font-weight: 700; border: 0; border-radius: 999px; background: #2B4944; color: #FFFFFF; cursor: pointer">التالي: بياناتك</button>
</div>
</sc-if>

<sc-if value="{{isStep2}}" hint-placeholder-val="{{ false }}">
<div class="up">
<h2 style="margin: 0 0 6px; font-size: 28px; color: #2B4944">بياناتك</h2>
<p style="margin: 0 0 24px; color: #4A5E5A">الحقول المعلّمة بـ * مطلوبة. نستخدم رقم جوالك للتحقق ولإرسال تحديثات طلبك على واتساب.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px">
<label style="display: flex; flex-direction: column; gap: 8px; font-weight: 600; color: #2B4944">الاسم الكامل *<input type="text" value="{{name}}" onInput="{{setName}}" placeholder="مثال: محمد عبدالله" style="font-family: inherit; font-size: 16px; padding: 14px 16px; border: 1.5px solid #D9D2C6; border-radius: 14px; background: #FBF9F5"></label>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="bk-phone" style="font-weight: 600; color: #2B4944">رقم الجوال *</label>
<div style="display: flex; direction: ltr; border: 1.5px solid #D9D2C6; border-radius: 14px; background: #FBF9F5; overflow: hidden"><span style="padding: 14px; font-family: 'IBM Plex Sans', sans-serif; color: #4A5E5A; border-right: 1.5px solid #D9D2C6">+966</span><input id="bk-phone" type="tel" inputmode="numeric" value="{{phone}}" onInput="{{setPhone}}" placeholder="5X XXX XXXX" style="flex: 1; min-width: 0; font-family: 'IBM Plex Sans', sans-serif; font-size: 16px; padding: 14px 16px; border: 0; background: transparent"></div>
</div>
<label style="display: flex; flex-direction: column; gap: 8px; font-weight: 600; color: #2B4944">البريد الإلكتروني (اختياري)<input type="email" value="{{email}}" onInput="{{setEmail}}" placeholder="name@example.com" style="direction: ltr; text-align: right; font-family: 'IBM Plex Sans', sans-serif; font-size: 16px; padding: 14px 16px; border: 1.5px solid #D9D2C6; border-radius: 14px; background: #FBF9F5"></label>
<div style="display: flex; flex-direction: column; gap: 8px; justify-content: flex-end"><span style="font-size: 14px; color: #4A5E5A; line-height: 1.7; background: #F7F2EB; border-radius: 14px; padding: 12px 14px">الاستشارة المختارة: <b style="color: #2B4944">{{itemLabel}}</b> · {{methodLabel}}</span></div>
</div>
<label style="display: flex; flex-direction: column; gap: 8px; font-weight: 600; color: #2B4944; margin-top: 18px">نبذة عن طلبك (اختياري)<textarea rows="3" onInput="{{setNote}}" placeholder="اكتب باختصار ما تحتاج المساعدة فيه" style="font-family: inherit; font-size: 16px; padding: 14px 16px; border: 1.5px solid #D9D2C6; border-radius: 14px; background: #FBF9F5; resize: vertical"></textarea></label>
<sc-if value="{{showErr}}" hint-placeholder-val="{{ false }}">
<p role="alert" style="margin: 16px 0 0; color: #A84F00; font-weight: 600">يرجى كتابة الاسم ورقم الجوال للمتابعة.</p>
</sc-if>
<div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px">
<button type="button" onClick="{{back}}" class="btn" style="flex: 1 1 140px; min-height: 56px; font-family: inherit; font-size: 16px; font-weight: 600; border: 1.5px solid #2B4944; border-radius: 999px; background: #FFFFFF; color: #2B4944; cursor: pointer">رجوع</button>
<button type="button" onClick="{{sendOtp}}" aria-disabled="{{notReady}}" class="btn" style="flex: 2 1 260px; min-height: 56px; font-family: inherit; font-size: 17px; font-weight: 700; border: 0; border-radius: 999px; background: {{sendBg}}; color: {{sendFg}}; cursor: pointer">أرسل رمز التحقق عبر واتساب</button>
</div>
</div>
</sc-if>

<sc-if value="{{isStep3}}" hint-placeholder-val="{{ false }}">
<div class="up">
<div class="pop" style="width: 72px; height: 72px; border-radius: 22px; background: #DDF3E4; display: flex; align-items: center; justify-content: center; margin-bottom: 18px"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1E7A47" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.2A8.5 8.5 0 1 1 21 12z"/><path d="M9 12l2 2 4-4"/></svg></div>
<h2 style="margin: 0 0 6px; font-size: 28px; color: #2B4944">تحقق من رقم جوالك</h2>
<p style="margin: 0 0 6px; color: #4A5E5A">أرسلنا رمزًا عبر واتساب إلى <span style="direction: ltr; unicode-bidi: isolate; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; color: #2B4944">+966 5X XXX XX21</span></p>
<p style="margin: 0 0 26px; font-size: 14px; color: #5A6B67">الرمز صالح لمدة 5 دقائق <span style="color: #A84F00">(للعرض: 4821)</span></p>
<div role="group" aria-label="رمز التحقق" style="display: flex; gap: 12px; direction: ltr; justify-content: center; margin-bottom: 18px">
<input aria-label="الرقم 1" inputmode="numeric" maxlength="1" value="4" style="width: 66px; height: 74px; text-align: center; font-size: 30px; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; border: 2px solid #2B4944; border-radius: 16px; background: #FBF9F5; color: #2B4944">
<input aria-label="الرقم 2" inputmode="numeric" maxlength="1" value="8" style="width: 66px; height: 74px; text-align: center; font-size: 30px; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; border: 2px solid #2B4944; border-radius: 16px; background: #FBF9F5; color: #2B4944">
<input aria-label="الرقم 3" inputmode="numeric" maxlength="1" value="2" style="width: 66px; height: 74px; text-align: center; font-size: 30px; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; border: 2px solid #2B4944; border-radius: 16px; background: #FBF9F5; color: #2B4944">
