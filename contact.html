<style>
body{margin:0;background:#F7F2EB}
a{color:#2B4944}a:hover{color:#D96C00}
@keyframes up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(30px,20px) rotate(8deg)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(37,165,95,.5)}100%{box-shadow:0 0 0 22px rgba(37,165,95,0)}}
header{position:sticky;top:0;z-index:20;box-shadow:0 8px 24px -16px rgba(0,0,0,.5)}
nav a{position:relative;transition:color .2s}
nav a::after{content:"";position:absolute;right:0;bottom:-6px;height:2px;width:0;background:#FFC800;transition:width .3s}
nav a:hover{color:#FFC800 !important}nav a:hover::after{width:100%}
header+section{position:relative;overflow:hidden}
header+section::before{content:"";position:absolute;width:1000px;height:1000px;left:-360px;top:-520px;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 98px,rgba(255,255,255,.1) 99px 100px);animation:drift 18s ease-in-out infinite;pointer-events:none}
header+section>div{position:relative;z-index:1}
header+section+section{position:relative;z-index:2}
header+section>div>*{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
header+section>div>*:nth-child(2){animation-delay:.12s}header+section>div>*:nth-child(3){animation-delay:.24s}
header+section+section>div>*{animation:up .9s .3s cubic-bezier(.2,.7,.2,1) both}
a[style*="#25A55F"]{animation:ring 2.2s ease-out infinite;transition:transform .3s}a[style*="#25A55F"]:hover{transform:translateY(-4px)}
button,a[style*="999px"]{transition:transform .25s,box-shadow .25s}
button:hover,a[style*="999px"]:hover{transform:translateY(-2px);box-shadow:0 14px 30px -10px rgba(0,0,0,.3)}
input,select,textarea{transition:border-color .2s,box-shadow .2s;outline:none}
input:focus,select:focus,textarea:focus{border-color:#FFC800 !important;box-shadow:0 0 0 4px rgba(255,200,0,.25)}
[style*="border-radius: 14px; background: #2B4944"]{transition:transform .4s}div:hover>[style*="border-radius: 14px; background: #2B4944"]{transform:rotate(-10deg) scale(1.08)}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { otp: 'idle' };
  }
  renderVals() {
    const otp = this.state.otp;
    return {
      notice: this.props.notice ?? true,
      notSent: otp === 'idle',
      otpOpen: otp === 'sent',
      verified: otp === 'verified',
      phoneBorder: otp === 'verified' ? '#1E7A47' : '#D9D2C6',
      submitBg: otp === 'verified' ? '#2B4944' : '#C9CFCC',
      submitFg: otp === 'verified' ? '#FFFFFF' : '#2B4944',
      sendOtp: () => this.setState({ otp: 'sent' }),
      verify: () => this.setState({ otp: 'verified' })
    };
  }
}
window.Component = Component;
</script>
</head>

<form style="flex: 1.5 1 480px; min-width: 0; background: #FFFFFF; border-radius: 28px; padding: 40px 36px; box-sizing: border-box">

<p style="margin: 0 0 26px; color: #4A5E5A">نتحقق من رقم جوالك برمز OTP لضمان وصول ردّنا إليك.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px">
<label style="display: flex; flex-direction: column; gap: 8px; font-weight: 600; color: #2B4944">الاسم الكامل<input type="text" placeholder="اكتب اسمك" style="font-family: inherit; font-size: 16px; padding: 14px 16px; border: 1.5px solid #D9D2C6; border-radius: 14px; background: #FBF9F5"></label>

<label style="display: flex; flex-direction: column; gap: 8px; font-weight: 600; color: #2B4944">نوع الاستفسار<select style="font-family: inherit; font-size: 16px; padding: 14px 16px; border: 1.5px solid #D9D2C6; border-radius: 14px; background: #FBF9F5"><option>استشارة إدارية</option><option>خدمة قانونية</option><option>خدمة محاسبية وضريبية</option><option>استفسار عام</option></select></label>

<label for="phone" style="font-weight: 600; color: #2B4944">رقم الجوال</label>

<div style="flex: 1; min-width: 0; display: flex; border: 1.5px solid {{phoneBorder}}; border-radius: 14px; background: #FBF9F5; overflow: hidden"><span style="padding: 14px 12px; font-family: 'IBM Plex Sans', sans-serif; color: #4A5E5A">+966</span><input id="phone" type="tel" placeholder="5X XXX XXXX" style="flex: 1; min-width: 0; font-family: 'IBM Plex Sans', sans-serif; font-size: 16px; padding: 14px 8px; border: 0; background: transparent"></div>
<sc-if value="{{notSent}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{sendOtp}}" style="flex: none; min-height: 52px; padding: 0 16px; font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 15px; font-weight: 700; border: 0; border-radius: 14px; background: #FFC800; color: #2B4944; cursor: pointer">أرسل الرمز</button>
</sc-if>
<sc-if value="{{verified}}" hint-placeholder-val="{{ false }}">

<div><div style="font-weight: 700; color: #2B4944">أدخل رمز التحقق</div><div style="font-size: 14px; color: #4A5E5A">أرسلنا رمزًا من 4 أرقام برسالة نصية</div></div>
<div role="group" aria-label="رمز التحقق" style="display: flex; gap: 8px; direction: ltr">
<input aria-label="الرقم 1" inputmode="numeric" maxlength="1" style="width: 48px; height: 54px; text-align: center; font-size: 22px; font-family: 'IBM Plex Sans', sans-serif; border: 1.5px solid #2B4944; border-radius: 12px; background: #FFFFFF">
<input aria-label="الرقم 2" inputmode="numeric" maxlength="1" style="width: 48px; height: 54px; text-align: center; font-size: 22px; font-family: 'IBM Plex Sans', sans-serif; border: 1.5px solid #2B4944; border-radius: 12px; background: #FFFFFF">
<input aria-label="الرقم 3" inputmode="numeric" maxlength="1" style="width: 48px; height: 54px; text-align: center; font-size: 22px; font-family: 'IBM Plex Sans', sans-serif; border: 1.5px solid #2B4944; border-radius: 12px; background: #FFFFFF">
<input aria-label="الرقم 4" inputmode="numeric" maxlength="1" style="width: 48px; height: 54px; text-align: center; font-size: 22px; font-family: 'IBM Plex Sans', sans-serif; border: 1.5px solid #2B4944; border-radius: 12px; background: #FFFFFF">
