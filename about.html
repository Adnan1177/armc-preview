@keyframes shine{from{transform:translateX(120%) skewX(-20deg)}to{transform:translateX(-220%) skewX(-20deg)}}

a[style*="#FFC800"][style*="999px"]{position:relative;overflow:hidden}

section li,section article,section [style*="border-radius: 28px"],section [style*="border-radius: 22px"],section [style*="border-radius: 24px"]{transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s}

@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

<p style="margin: 0 0 16px; line-height: 2; color: #4A5E5A; font-size: 17px">أفكار الريادة للاستشارات شركة سعودية متخصصة في تقديم الاستشارات الإدارية والقانونية والمحاسبية، تعمل من خلال فريق من المختصين وشراكات مهنية لتقديم حلول عملية تتناسب مع احتياجات كل عميل.</p>
<p style="margin: 0; line-height: 2; color: #4A5E5A; font-size: 17px">نراعي متغيرات السوق في كل توصية نقدمها، ونضع الثقة والوضوح في جوهر أعمالنا — وهي الفكرة نفسها التي بُنيت عليها هويتنا: عنصران متقابلان، أحدهما الشركة والآخر العميل، يكمّل كل منهما الآخر.</p>
